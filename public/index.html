<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Pet</title>
    <style>
        :root {
            --bubble-bg: rgba(255, 252, 245, 0.96);
            --bubble-border: rgba(108, 74, 40, 0.16);
            --bubble-text: #47311d;
            --panel-bg: rgba(255, 248, 238, 0.92);
            --panel-border: rgba(255, 255, 255, 0.7);
            --accent: #ff9f68;
            --accent-strong: #e96f3c;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #bubble {
            position: absolute;
            left: calc(50% + 60px);
            bottom: 220px;
            transform: translateY(8px);
            min-width: 50px;
            max-width: 180px;
            padding: 7px 5px;
            border-radius: 18px;
            background: var(--bubble-bg);
            border: 1px solid var(--bubble-border);
            color: var(--bubble-text);
            box-shadow: 0 16px 34px rgba(78, 44, 16, 0.14);
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease, transform 160ms ease;
            backdrop-filter: blur(10px);
        }

        #bubble.show {
            opacity: 1;
            transform: translateY(0);
        }

        #bubble::after {
            content: "";
            position: absolute;
            left: -10px;
            bottom: 2px;
            width: 28px;
            height: 18px;
            background: var(--bubble-bg);
            border-bottom: 1px solid var(--bubble-border);
            border-left: 1px solid var(--bubble-border);
            transform: rotate(45deg);
        }

        #bubbleText {
            position: relative;
            z-index: 1;
            font-size: 12px;
            line-height: 1.45;
        }

        #stage {
            position: absolute;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%);
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        #stage.dragging {
            cursor: grabbing;
        }

        canvas {
            width: 300px;
            height: 260px;
            background: transparent;
        }

        #hud {
            position: absolute;
            left: 50%;
            bottom: 160px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 253, 247, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 10px 20px rgba(57, 39, 21, 0.12);
            font-size: 12px;
            color: #5d4630;
        }

        #inputDock {
            position: absolute;
            left: 50%;
            bottom: 270px;
            transform: translateX(-50%) translateY(10px) scale(0.96);
            width: 282px;
            display: flex;
            gap: 8px;
            padding: 10px;
            border-radius: 18px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 36px rgba(61, 38, 14, 0.18);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease, transform 160ms ease;
            z-index: 12;
        }

        #inputDock.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        #inputDock::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -9px;
            width: 16px;
            height: 10px;
            background: var(--panel-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.78);
            border-bottom: 1px solid rgba(255, 255, 255, 0.78);
            transform: translateX(-50%) rotate(45deg);
        }

        #chatInput {
            flex: 1;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 12px;
            color: #352112;
            box-shadow: inset 0 0 0 1px rgba(113, 74, 39, 0.06);
        }

        #sendBtn {
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            width: 72px;
            font-size: 14px;
            cursor: pointer;
        }

        #dockHint {
            position: absolute;
            left: 16px;
            top: -22px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            line-height: 1;
            color: #6a4a30;
            background: rgba(255, 249, 240, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 8px 16px rgba(61, 38, 14, 0.08);
        }

        #petMenu {
            position: absolute;
            min-width: 132px;
            padding: 8px;
            border-radius: 16px;
            background: rgba(255, 248, 238, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 18px 36px rgba(61, 38, 14, 0.18);
            backdrop-filter: blur(12px);
            display: none;
            z-index: 20;
        }

        #petMenu.show {
            display: block;
        }

        .pet-menu-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: #4b3321;
            text-align: left;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .pet-menu-btn:hover {
            background: rgba(255, 159, 104, 0.18);
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="bubble">
            <div id="bubbleText"></div>
        </div>
        <div id="stage">
            <canvas id="petCanvas" width="260" height="260"></canvas>
        </div>
        <div id="hud">
            <span id="petStageLabel">Stage</span>
            <span id="petLevelLabel">Lv.1</span>
            <span id="petMoodLabel">Mood 85</span>
        </div>
        <div id="inputDock">
            <div id="dockHint">I am listening</div>
            <input id="chatInput" type="text" placeholder="Say something..." />
            <button id="sendBtn">Send</button>
        </div>
        <div id="petMenu">
            <button class="pet-menu-btn" data-action="feed">Feed</button>
            <button class="pet-menu-btn" data-action="clean">Clean</button>
            <button class="pet-menu-btn" data-action="play">Play</button>
            <button class="pet-menu-btn" data-action="sleep">Sleep</button>
            <button class="pet-menu-btn" data-action="chat">Chat</button>
        </div>
    </div>
    <script type="module" src="../dist/renderer/app.js"></script>
</body>
</html>
